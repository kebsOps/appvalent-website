<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Naijaverse has moved</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://naijaverse.app/">
<meta http-equiv="refresh" content="4;url=https://naijaverse.app/">
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#163b32;color:#f5f5df;font-family:system-ui,sans-serif;text-align:center;padding:24px}a{color:#c0e573}</style>
</head><body><div><h1>Naijaverse has moved</h1><p>Taking you to <a href="https://naijaverse.app/">naijaverse.app</a>…</p></div>
<script>
/* Hand the player's saved game and online identity to the new address (in the URL fragment, never sent to a server). */
try{const o={};for(const k of Object.keys(localStorage))if(/^naija-life-[a-z0-9-]{1,40}$/.test(k))o[k]=localStorage.getItem(k);
const json=JSON.stringify(o);let target='https://naijaverse.app/';
if(Object.keys(o).length&&json.length<150000)target+='#mig='+btoa(unescape(encodeURIComponent(json))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
location.replace(target)}catch(e){location.replace('https://naijaverse.app/')}
</script></body></html>
